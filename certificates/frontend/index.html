<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Certificate</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../css/styles.css">
</head>

<body class="Certificates">

<header class="site-header">
  <nav class="container nav-wrap">
    <a class="brand" href="../index/">
      <img class="brand-logo" src="../assets/logos/Primary_logo.png" />
    </a>

    <div class="nav-links">
      <a href="../index/">Home</a>
      <a href="../about/">About</a>
      <a href="../tracks/">Tracks</a>
      <a href="../certificates/frontend/">Certificates</a>
      <a href="../rules/">Rules</a>
      <a href="../index/#faq">FAQ</a>
    </div>
  </nav>
</header>

<div class="cert-wrapper">
  <div class="cert-container">
    <div class="cert-card">

      <h1 class="cert-title">👑 Generate Certificate</h1>

      <p class="cert-subtitle">
        We’re glad to have you at <strong>DevQueens</strong> 💚
      </p>

      <input id="nameInput" type="text" placeholder="Enter your full name" class="cert-input"/>

      <button id="searchBtn" onclick="search()" class="cert-btn">
        Search
      </button>

      <p id="notFound" class="error-text hidden">❌ Name not found</p>

      <div id="resultBox" class="result-box hidden">
        <p class="success-text">
          ✅ Found: <strong id="resultName"></strong>
        </p>

        <button id="downloadBtn" onclick="downloadCertificate()" class="cert-btn">
          ⬇ Download Certificate
        </button>

        <button onclick="clearAll()" class="clear-btn">Clear</button>
      </div>

    </div>
  </div>
</div>

<script>
const API = "https://devqueens-certificates.onrender.com";
let currentName = "";

// 🔍 SEARCH
async function search() {
  const name = document.getElementById("nameInput").value.trim();
  const btn = document.getElementById("searchBtn");

  if (!name) {
    alert("Please enter a name");
    return;
  }

  hideAll();

  // 🔄 Loading state
  btn.disabled = true;
  btn.innerText = "⏳ Searching...";

  try {
    const res = await fetch(`${API}/search?name=${encodeURIComponent(name)}`);

    if (!res.ok) {
      document.getElementById("notFound").classList.remove("hidden");
      return;
    }

    const data = await res.json();

    currentName = data.Name;

    document.getElementById("resultName").innerText = currentName;
    document.getElementById("resultBox").classList.remove("hidden");

  } catch (err) {
    console.error(err);
    alert("Server is waking up. Please try again in a few seconds.");
  } finally {
    btn.disabled = false;
    btn.innerText = "Search";
  }
}

// 📥 DOWNLOAD (MOBILE SAFE)
function downloadCertificate() {
  const btn = document.getElementById("downloadBtn");

  if (!currentName) {
    alert("Please search a name first!");
    return;
  }

  btn.innerText = "⏳ Opening...";

  window.open(
    `${API}/certificate?name=${encodeURIComponent(currentName)}`,
    "_blank"
  );

  setTimeout(() => {
    btn.innerText = "⬇ Download Certificate";
  }, 2000);
}

// 🧹 CLEAR
function clearAll() {
  document.getElementById("nameInput").value = "";
  currentName = "";
  hideAll();
}

// 🔄 RESET UI
function hideAll() {
  document.getElementById("notFound").classList.add("hidden");
  document.getElementById("resultBox").classList.add("hidden");
}
</script>

</body>
</html>
