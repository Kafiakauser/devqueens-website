<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Certificate</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <link rel="stylesheet" href="../../css/styles.css">
  
  <style>
    /* Mobile Responsive Fixes */
    @media (max-width: 768px) {
      body.Certificates {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .cert-wrapper {
        height: auto;
        min-height: 100vh;
        padding: 20px 0;
        padding-top: 80px;
        overflow: visible;
      }

      .cert-container {
        width: 100%;
        padding: 0 16px;
      }

      .cert-card {
        padding: 20px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .cert-title {
        font-size: 20px;
      }

      .cert-subtitle {
        font-size: 12px;
      }

      .cert-input,
      .cert-btn,
      .clear-btn {
        width: 100%;
        font-size: 16px;
        padding: 14px;
        box-sizing: border-box;
      }

      .cert-btn {
        margin-top: 8px;
      }

      .clear-btn {
        margin-top: 8px;
      }
    }

    @media (max-width: 480px) {
      .cert-wrapper {
        padding-top: 70px;
      }

      .cert-card {
        padding: 16px;
        border-radius: 16px;
      }

      .cert-title {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .cert-subtitle {
        font-size: 11px;
        margin-bottom: 16px;
      }

      .cert-input {
        padding: 12px;
      }
    }

    /* Clear Button Styling */
    .clear-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(96,255,248,0.2);
      color: #60fff8;
      transition: 0.2s ease;
    }

    .clear-btn:hover {
      background: rgba(96,255,248,0.1);
      border-color: rgba(96,255,248,0.4);
    }

    /* Ensure input doesn't auto-zoom on iOS */
    input:focus {
      font-size: 16px;
    }
  </style>
</head>

<body class="Certificates">

<header class="site-header">
  <nav class="container nav-wrap">
    <a class="brand" href="../../index/">
      <img class="brand-logo" src="../../assets/logos/Primary_logo.png" alt="DevQueens Logo" />
    </a>

    <button class="menu-btn" data-menu-btn type="button" aria-label="Toggle menu">Menu</button>
    
    <div class="nav-links" data-nav-links>
      <a class="nav-link" href="../../index/">Home</a>
      <a class="nav-link" href="../../about/">About</a>
      <a class="nav-link" href="../../tracks/">Tracks</a>
      <a class="nav-link" href="../../schedule/">Schedule</a>
      <a class="nav-link" href="../../certificates/frontend/">Certificates</a>
      <a class="nav-link" href="../../rules/">Rules</a>
      <a class="nav-link" href="../../index/#faq">FAQ</a>
    </div>
  </nav>
</header>

<div class="cert-wrapper">
  <div class="cert-container">
    <div class="cert-card">

      <h1 class="cert-title">👑 Generate Certificate</h1>

      <p class="cert-subtitle">
        We're glad to have you at <strong>DevQueens</strong> 💚
      </p>

      <input 
        id="nameInput" 
        type="text" 
        placeholder="Enter your full name" 
        class="cert-input"
        style="font-size: 16px;"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
      />

      <button id="searchBtn" onclick="search()" class="cert-btn" type="button">
        Search
      </button>

      <p id="notFound" class="error-text hidden">❌ Name not found</p>

      <div id="resultBox" class="result-box hidden">
        <p class="success-text">
          ✅ Found: <strong id="resultName"></strong>
        </p>

        <button id="downloadBtn" onclick="downloadCertificate()" class="cert-btn" type="button">
          ⬇ Download Certificate
        </button>

        <button onclick="clearAll()" class="clear-btn" type="button">Clear</button>
      </div>

    </div>
  </div>
</div>

<script>
const API = "https://devqueens-certificates.onrender.com";
let currentName = "";

// 🔍 SEARCH
async function search() {
  const name = document.getElementById("nameInput").value.trim();
  const btn = document.getElementById("searchBtn");

  if (!name) {
    alert("Please enter a name");
    return;
  }

  hideAll();

  // 🔄 Loading state
  btn.disabled = true;
  btn.innerText = "⏳ Searching...";

  try {
    const res = await fetch(`${API}/search?name=${encodeURIComponent(name)}`);

    if (!res.ok) {
      document.getElementById("notFound").classList.remove("hidden");
      btn.disabled = false;
      btn.innerText = "Search";
      return;
    }

    const data = await res.json();

    currentName = data.Name;

    document.getElementById("resultName").innerText = currentName;
    document.getElementById("resultBox").classList.remove("hidden");

  } catch (err) {
    console.error(err);
    document.getElementById("notFound").classList.remove("hidden");
    alert("Server is waking up. Please try again in a few seconds.");
  } finally {
    btn.disabled = false;
    btn.innerText = "Search";
  }
}

// 📥 DOWNLOAD (MOBILE SAFE)
function downloadCertificate() {
  const btn = document.getElementById("downloadBtn");

  if (!currentName) {
    alert("Please search a name first!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "⏳ Opening...";

  // Open in new tab for mobile and desktop
  window.open(
    `${API}/certificate?name=${encodeURIComponent(currentName)}`,
    "_blank"
  );

  setTimeout(() => {
    btn.disabled = false;
    btn.innerText = "⬇ Download Certificate";
  }, 2000);
}

// 🧹 CLEAR
function clearAll() {
  document.getElementById("nameInput").value = "";
  currentName = "";
  hideAll();
  document.getElementById("nameInput").focus();
}

// 🔄 RESET UI
function hideAll() {
  document.getElementById("notFound").classList.add("hidden");
  document.getElementById("resultBox").classList.add("hidden");
}

// Allow Enter key to search
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("nameInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      search();
    }
  });
});
</script>

</body>
</html>
