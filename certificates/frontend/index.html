  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>

  <body class="Certificates">
    <canvas id="particles" aria-hidden="true"></canvas>

    <header class="site-header">
      <nav class="container nav-wrap" aria-label="Primary navigation">
        <a class="brand" href="../index/">
          <img class="brand-logo" src="../assets/logos/Primary_logo.png" alt="DevQueens logo" />
        </a>
        <button class="menu-btn" data-menu-btn type="button" aria-label="Toggle menu">Menu</button>
        <div class="nav-links" data-nav-links>
          <a class="nav-link" href="../index/">Home</a>
          <a class="nav-link" href="../about/">About</a>
          <a class="nav-link" href="../tracks/">Tracks</a>
          <a class="nav-link" href="../certificates/frontend/">Certificates</a>
          <a class="nav-link" href="../rules/">Rules</a>
          <a class="nav-link" href="../index/#faq">FAQ</a>
        </div>
      </nav>
    </header>

  <!-- MAIN WRAPPER -->
<div class="cert-wrapper">

  <!-- BACKGROUND GLOW -->
  <div class="glow glow-left"></div>
  <div class="glow glow-right"></div>

  <!-- CARD -->
  <div class="cert-container">

    <div class="cert-card">

      <h1 class="cert-title">👑 Generate Certificate</h1>

      <p class="cert-subtitle">
        We’re glad to have you at <strong>DevQueens</strong> 💚<br/>
        Your presence made our event shine brighter
      </p>

      <input id="nameInput"
        type="text"
        placeholder="Enter your full name"
        class="cert-input"
      />

      <button onclick="search()" class="cert-btn">
        Search
      </button>

      <p id="notFound" class="error-text hidden">
        ❌ Name not found in certificate list
      </p>

      <p id="errorMsg" class="warning-text hidden">
        ⚠️ Something went wrong
      </p>

      <!-- RESULT -->
      <div id="resultBox" class="result-box hidden">

        <p class="success-text">
          ✅ Found: <strong id="resultName"></strong>
        </p>

        <button id="downloadBtn" onclick="downloadCertificate()" class="cert-btn">⬇ Download Certificate</button>

        <button onclick="clearAll()" class="clear-btn">
          Clear
        </button>

      </div>

    </div>
  </div>
</div>


<script>
  const API = "https://devqueens-certificates.onrender.com";

async function search() {
  const name = document.getElementById("nameInput").value.trim();

  console.log("Search clicked:", name); // DEBUG

  if (!name) {
    alert("Please enter a name");
    return;
  }

  hideAll();

  try {
    const res = await fetch(`${API}/search?name=${encodeURIComponent(name)}`);

    console.log("Status:", res.status);

    const data = await res.json();
    console.log("Response:", data);

    if (!res.ok) {
      document.getElementById("notFound").classList.remove("hidden");
      return;
    }

    currentName = data.Name;

    document.getElementById("resultName").innerText = currentName;
    document.getElementById("resultBox").classList.remove("hidden");

  } catch (err) {
    console.error("Search error:", err);
    document.getElementById("errorMsg").classList.remove("hidden");
  }
}

  let currentName = "";

  function downloadCertificate() {
  const btn = document.getElementById("downloadBtn");

  if (!currentName) {
    alert("Please search a name first!");
    return;
  }

  btn.innerText = "⏳ Opening...";

  window.open(
    `${API}/certificate?name=${encodeURIComponent(currentName)}`,
    "_blank"
  );

  setTimeout(() => {
    btn.innerText = "⬇ Download Certificate";
  }, 2000);
}
  // 🧹 CLEAR
  function clearAll() {
    document.getElementById("nameInput").value = "";
    currentName = "";
    hideAll();
  }

  function hideAll() {
    document.getElementById("notFound").classList.add("hidden");
    document.getElementById("errorMsg").classList.add("hidden");
    document.getElementById("resultBox").classList.add("hidden");
  }
</script>

</body>
</html>
