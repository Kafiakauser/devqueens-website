<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Certificate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Exo 2", sans-serif;
      background: #050806;
      color: #e9f5ef;
    }

    .app-bg {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-top: 100px;
      position: relative;
      overflow: hidden;
    }

    .bg-glow::before,
    .bg-glow::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(120px);
    }

    .bg-glow::before {
      background: rgba(96, 255, 248, 0.15);
      top: -120px;
      left: -120px;
    }

    .bg-glow::after {
      background: rgba(0, 152, 144, 0.15);
      bottom: -120px;
      right: -120px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    .card {
      padding: 26px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 0 20px rgba(96,255,248,0.15);
    }

    .title {
      font-size: 26px;
      margin-bottom: 10px;
      color: #dcfffd;
    }

    .tagline {
      font-size: 13px;
      color: #60fff8;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: #0c1512;
      color: #e9f5ef;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .input:focus {
      outline: none;
      box-shadow: 0 0 10px #60fff8;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: rgba(0,152,144,0.4);
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 500;
    }

    .btn:hover {
      box-shadow: 0 0 12px rgba(96,255,248,0.6);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .clear {
      margin-top: 8px;
      background: transparent;
      color: #7fa89a;
    }

    .resultBox {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
    }

    .success {
      color: #60fff8;
    }

    .error {
      margin-top: 10px;
      color: #ff6b6b;
      font-size: 14px;
    }

    .warning {
      color: #ffd166;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="app-bg">
  <div class="bg-glow"></div>

  <div class="container">
    <div class="card">

      <h1 class="title">👑 Generate Certificate</h1>

      <p class="tagline">
        We’re glad to have you at <strong>DevQueens</strong> 💚 <br />
        Your presence made our event shine brighter
      </p>

      <input id="nameInput" type="text" placeholder="Enter your full name" class="input" />

      <button class="btn" onclick="search()">Search</button>

      <p id="notFound" class="error hidden">❌ Name not found in certificate list</p>
      <p id="errorMsg" class="error warning hidden">⚠️ Something went wrong</p>

      <div id="resultBox" class="resultBox hidden">
        <p class="success">
          ✅ Found: <strong id="resultName"></strong>
        </p>

        <button id="downloadBtn" class="btn" onclick="downloadCertificate()">⬇ Download Certificate</button>
        <button class="btn clear" onclick="clearAll()">Clear</button>
      </div>

    </div>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8000";

async function search() {
  const name = document.getElementById("nameInput").value.trim();

  console.log("Search clicked:", name); // DEBUG

  if (!name) {
    alert("Please enter a name");
    return;
  }

  hideAll();

  try {
    const res = await fetch(`${API}/search?name=${encodeURIComponent(name)}`);

    console.log("Status:", res.status);

    const data = await res.json();
    console.log("Response:", data);

    if (!res.ok) {
      document.getElementById("notFound").classList.remove("hidden");
      return;
    }

    currentName = data.Name;

    document.getElementById("resultName").innerText = currentName;
    document.getElementById("resultBox").classList.remove("hidden");

  } catch (err) {
    console.error("Search error:", err);
    document.getElementById("errorMsg").classList.remove("hidden");
  }
}

  let currentName = "";

  async function downloadCertificate() {
  const btn = document.getElementById("downloadBtn");

  try {
    if (!currentName) {
      alert("Please search a name first!");
      return;
    }

    // 🔄 Show loading state
    btn.disabled = true;
    btn.innerText = "⏳ Generating...";

    const res = await fetch(
      `${API}/certificate?name=${encodeURIComponent(currentName)}`
    );

    if (!res.ok) throw new Error("Download failed");

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `Certificate_${currentName.replace(/\s+/g, "_")}.png`;
    a.click();

    window.URL.revokeObjectURL(url);

  } catch (err) {
    console.error(err);
    document.getElementById("errorMsg").classList.remove("hidden");

  } finally {
    // 🔄 Reset button
    btn.disabled = false;
    btn.innerText = "⬇ Download Certificate";
  }
}

  // 🧹 CLEAR
  function clearAll() {
    document.getElementById("nameInput").value = "";
    currentName = "";
    hideAll();
  }

  function hideAll() {
    document.getElementById("notFound").classList.add("hidden");
    document.getElementById("errorMsg").classList.add("hidden");
    document.getElementById("resultBox").classList.add("hidden");
  }
</script>

</body>
</html>
